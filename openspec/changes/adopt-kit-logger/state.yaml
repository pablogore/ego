    engram_topics:
      - sdd/adopt-kit-logger/explore
      - sdd/adopt-kit-logger/explore-repo
      - sdd/adopt-kit-logger/explore-external
  pr_a_prime:
    status: implemented
    branch: feat/consolidate-logging-boundary
    commits: [b0cc5ab, 852c5de, 5014d36, c50d597]
    diff: 310 insertions / 24 deletions across 11 files
    artifact: engram sdd/adopt-kit-logger/apply-progress
  decision:
    status: done
    date: 2026-09-12
    decided_by: user
    summary: >
      Adopt kit-logger as THE logging API of eGo, replacing the ego.Logger seam
      entirely (not opt-in). kit-logger main at f602522 (2026-09-12) resolved
      the blocking defects D1-D7 recorded in exploration.md: Prometheus is
      opt-in (Config.MetricsHandler), the init-time stdout line is opt-in
      (Config.LogInitialization), output is configurable (Config.Writer /
      Config.Sink), Flush/Shutdown are real (ManagedLogger), every log method
      has a level-disabled fast path, globals are atomic, and an OpenTelemetry
      correlation decorator ships in pkg/logger/otel. kit-logger 17d1a6e (same
      day) then added CallerSkipper/WithCallerSkip and made call-site
      attribution opt-in under "source", so eGo's GoAkt adapter skips its own
      frame and records name GoAkt's real call site; pin bumped accordingly.
  apply:
    status: done
    branch: main (working tree)
    summary: >
      logger.go rewritten as a thin kitlog.Logger -> GoAkt log.Logger adapter;
      ego.WithLogger, migration.WithLogger, kafka.Config.Logger take
      kitlog.Logger; DefaultLogger() returns kitlog.L(); DiscardLogger is a
      kit-logger with a discard sink; engine, projection runner, saga actor,
      janitor and snapshot writer log structured records through kit-logger;
      examples converted; readme and CHANGELOG updated; architecture test now
      bans GoAkt's log package and the standard library loggers outside
      logger.go.
  proposal: { status: superseded, reason: decision recorded above }
  spec:     { status: superseded }
  design:   { status: superseded }
  tasks:    { status: superseded }
  verify:   { status: pending }
  archive:  { status: pending }

key_findings:
  - The ego.Logger seam, WithLogger option, DiscardLogger, slog default and the
    GoAkt loggerAdapter already exist and are public since v4.4.3.
    (Superseded 2026-09-12: the seam was replaced by kit-logger's Logger.)
  - kit-logger.Logger is a strict superset of ego.Logger, so *SlogLogger already
    satisfies ego.Logger with zero adapter code.
  - kit-logger has NO redaction and NO automatic OTel trace correlation, despite
    its README claiming redaction.
  - Zero first-party zap imports already; zap enters only via goakt/v4/log.
  - The repo carries no vendor/ tree but the Makefile test target uses -mod=vendor,
    so `make test` requires an out-of-band `go mod vendor`.
